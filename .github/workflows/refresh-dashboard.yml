name: Refresh dashboard (The Pulse)

# Runs the dashboard pipeline on a schedule and publishes the result to
# Cloudflare Pages. Rolling state (history / last-good sheet values) is
# pulled from and pushed back to Cloudflare KV so it survives between runs.
#
# Why every 15 min: matches the brief. GitHub's scheduler is "best effort"
# and can run a few minutes late under load — fine for a wall display.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # lets you trigger a run by hand from the Actions tab

# Never let two dashboard runs overlap (they share KV state).
concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KV_ID: ${{ secrets.CLOUDFLARE_KV_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The scripts read PA / sheet / BART-reads creds from a .dev.vars file.
      # We materialise it from GitHub secrets at runtime (it is git-ignored,
      # and the runner is destroyed when the job ends).
      - name: Write .dev.vars from secrets
        run: |
          cat > .dev.vars <<'EOF'
          PA_ACCESS_KEY=${{ secrets.PA_ACCESS_KEY }}
          PA_SECRET_KEY=${{ secrets.PA_SECRET_KEY }}
          PA_SITE_ID=${{ secrets.PA_SITE_ID }}
          MANUAL_SHEET_URL=${{ secrets.MANUAL_SHEET_URL }}
          BART_SESSION_COOKIE=${{ secrets.BART_SESSION_COOKIE }}
          BART_NAME=${{ secrets.BART_NAME }}
          EOF

      # Pull rolling state out of KV into data/ (missing keys are fine on the
      # very first run — the script just starts a fresh history).
      - name: Restore rolling state from Cloudflare KV
        run: |
          mkdir -p data
          for f in history.json manual.json eng_history.json crossings_seen.json daily_done.json; do
            npx -y wrangler@4 kv key get "$f" --namespace-id "$KV_ID" --remote > "data/$f" 2>/dev/null || true
            # Keep it ONLY if it's valid JSON. A missing key can return empty/junk,
            # which would crash the Python loader — so validate, else drop it.
            if [ -s "data/$f" ] && python3 -c "import json,sys; json.load(open('data/$f'))" 2>/dev/null; then
              echo "restored data/$f"
            else
              rm -f "data/$f"; echo "no valid KV value for $f yet (ok)"
            fi
          done

      - name: Refresh metrics  (Piano VX + Analytics + BART)
        env:
          PIANO_AID: ${{ secrets.PIANO_AID }}
          PIANO_API_TOKEN: ${{ secrets.PIANO_API_TOKEN }}
          PIANO_BASE_URL: ${{ secrets.PIANO_BASE_URL }}
          BART_BASE_URL: ${{ secrets.BART_BASE_URL }}
          BART_KEY: ${{ secrets.BART_KEY }}
        run: python3 scripts/refresh_metrics.py

      # Daily sheet jobs (engagement log + article HIT-crossings), off THIS reliable
      # 15-min job. Run ONCE per day on the FIRST run at/after 07:00 UTC, tracked by
      # data/daily_done.json — NOT gated to the narrow 07:00-07:14 slot, because
      # Cloudflare can drop that single fire (it did Aug 26-30, silently losing
      # engagement those days). Any run after 07:00 now covers the day. The step
      # persists its own state immediately (the hourly save below may not run in the
      # same 15-min slot). continue-on-error: a webhook hiccup must never fail the deploy.
      - name: Daily sheet jobs (once/day, first run after 07:00 UTC)
        continue-on-error: true
        env:
          METRICS_JSON: public/metrics.json
          HITS_WEBHOOK_URL: ${{ secrets.HITS_WEBHOOK_URL }}
          HITS_WEBHOOK_KEY: ${{ secrets.HITS_WEBHOOK_KEY }}
        run: |
          TODAY=$(date -u +%F); H=$(date -u +%-H)
          LAST=$(python3 -c "import json;print(json.load(open('data/daily_done.json')).get('date',''))" 2>/dev/null || echo "")
          if [ "$H" -lt 7 ] || [ "$LAST" = "$TODAY" ]; then
            echo "daily sheet jobs already done for $TODAY (or before 07:00 UTC) — skipping"
            exit 0
          fi
          echo "running daily sheet jobs for $TODAY"
          ok=1
          python3 scripts/daily_engagement.py || ok=0
          python3 scripts/track_crossings.py || ok=0
          # Always persist the crossings seen-set (it may have logged new crossings).
          npx -y wrangler@4 kv key put crossings_seen.json --path data/crossings_seen.json --namespace-id "$KV_ID" --remote || true
          if [ "$ok" = "1" ]; then
            python3 -c "import json;json.dump({'date':'$TODAY'},open('data/daily_done.json','w'))"
            npx -y wrangler@4 kv key put daily_done.json --path data/daily_done.json --namespace-id "$KV_ID" --remote
          else
            echo "a daily job failed — leaving the marker unset so it retries on the next run"
          fi

      # Rolling state (history / manual / engagement) are DAILY figures for the 7-day
      # trends, so there's no need to write them every 15 min. Persist ONLY on the
      # top-of-hour run (~once/hour) to stay well under the free KV write limit.
      - name: Save rolling state back to Cloudflare KV (hourly)
        run: |
          if [ "$(date -u +%-M)" -lt 15 ]; then
            for f in history.json manual.json eng_history.json; do
              if [ -f "data/$f" ]; then
                npx -y wrangler@4 kv key put "$f" --path "data/$f" --namespace-id "$KV_ID" --remote
              fi
            done
          else
            echo "not the top-of-hour run — skipping state persist to conserve KV writes"
          fi

      # KV is the single source of truth for both output files. Publish the fresh
      # metrics.json to KV so every deploy (here and the live job) uses the current one.
      - name: Push metrics.json to Cloudflare KV
        run: npx -y wrangler@4 kv key put metrics.json --path public/metrics.json --namespace-id "$KV_ID" --remote

      # A Pages deploy is a full snapshot, so carry the live screen's live.json too.
      # Pull it from KV (the store the live job writes to) — not a Pages HTTP fetch,
      # which could be edge-cached and cause the stale re-publish (clobber) we hit.
      - name: Pull latest live.json from Cloudflare KV
        run: |
          npx -y wrangler@4 kv key get live.json --namespace-id "$KV_ID" --remote > public/live.json 2>/dev/null || true
          if ! python3 -c "import json,sys; json.load(open('public/live.json'))" 2>/dev/null; then
            echo "no valid live.json in KV yet (the live job will publish it)"; rm -f public/live.json
          fi

      # Build id (the commit SHA) so the screens auto-reload when new code ships.
      # Same value across data-only re-runs, so it only changes when code changes.
      - name: Stamp build version
        run: echo "${GITHUB_SHA}" > public/version.txt

      - name: Publish to Cloudflare Pages
        run: |
          npx -y wrangler@4 pages deploy public \
            --project-name "${{ vars.PAGES_PROJECT }}" \
            --branch main --commit-dirty=true
