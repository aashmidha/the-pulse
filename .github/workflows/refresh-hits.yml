name: Weekly HITs report (manual only)

# RETIRED as a scheduled job 2026-08-20 — superseded by the daily HIT-crossings tracker
# (scripts/track_crossings.py, run from refresh-dashboard.yml), which logs each article
# once when it crosses 1,000 subscriber reads. This is kept for on-demand use only:
# run it by hand from the Actions tab to pull a one-off weekly roster into the HITs tab.

on:
  workflow_dispatch: {}   # manual only — no schedule

concurrency:
  group: weekly-hits

jobs:
  hits:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Report weekly HITs to the sheet
        env:
          BART_SESSION_COOKIE: ${{ secrets.BART_SESSION_COOKIE }}
          BART_NAME: ${{ secrets.BART_NAME }}
          HITS_WEBHOOK_URL: ${{ secrets.HITS_WEBHOOK_URL }}
          HITS_WEBHOOK_KEY: ${{ secrets.HITS_WEBHOOK_KEY }}
        run: python3 scripts/weekly_hits.py
