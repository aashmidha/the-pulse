name: Refresh live screen (Real-Time)

# Runs the fast live pipeline every ~5 min and publishes live.json to Pages.
# It does NOT recompute the heavy dashboard; it reads the latest metrics.json
# (for "subscriptions today") straight from the published site.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: refresh-live
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KV_ID: ${{ secrets.CLOUDFLARE_KV_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write .dev.vars from secrets
        run: |
          cat > .dev.vars <<'EOF'
          PA_ACCESS_KEY=${{ secrets.PA_ACCESS_KEY }}
          PA_SECRET_KEY=${{ secrets.PA_SECRET_KEY }}
          PA_SITE_ID=${{ secrets.PA_SITE_ID }}
          BART_SESSION_COOKIE=${{ secrets.BART_SESSION_COOKIE }}
          BART_NAME=${{ secrets.BART_NAME }}
          EOF

      # KV is the single source of truth for both JSON files. Pull the latest
      # metrics.json from KV (live.py reads newSubsToday from it). Reading from KV
      # — the store both jobs write to — avoids the stale-HTTP-cache clobber that
      # a Pages fetch could hit. Missing/invalid → empty (live.py degrades fine).
      - name: Pull latest metrics.json from Cloudflare KV
        run: |
          mkdir -p public
          npx -y wrangler@4 kv key get metrics.json --namespace-id "$KV_ID" > public/metrics.json 2>/dev/null || true
          if ! python3 -c "import json,sys; json.load(open('public/metrics.json'))" 2>/dev/null; then
            echo "no valid metrics.json in KV yet — empty fallback"; echo '{}' > public/metrics.json
          fi

      - name: Refresh live screen
        run: python3 scripts/refresh_live.py

      # Publish the freshly-generated live.json to KV so the dashboard job (and the
      # next live job) always deploy the current one — no stale re-publish.
      - name: Push live.json to Cloudflare KV
        run: npx -y wrangler@4 kv key put live.json --path public/live.json --namespace-id "$KV_ID"

      - name: Publish to Cloudflare Pages
        run: |
          npx -y wrangler@4 pages deploy public \
            --project-name "${{ vars.PAGES_PROJECT }}" \
            --branch main --commit-dirty=true
